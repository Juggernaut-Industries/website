<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta -->
  <title>Juggernaut Industries Limited | Coming Soon</title>
  <meta name="description" content="Juggernaut Industries Limited (JIL) — Our new website is under construction. A Nigerian company delivering quality services across Mining, Agriculture, Construction, and Renewable Energy since 2006." />
  <meta name="keywords" content="Juggernaut Industries, JIL Nigeria, Mining Nigeria, Agriculture Nigeria, Construction Abuja, Renewable Energy Nigeria" />
  <meta name="author" content="Juggernaut Industries Limited" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://juggernautind.com" />

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0D1B2A" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://juggernautind.com" />
  <meta property="og:title" content="Juggernaut Industries Limited | Coming Soon" />
  <meta property="og:description" content="Our new website is under construction. A Nigerian company delivering quality services across Mining, Agriculture, Construction, and Renewable Energy since 2006." />
  <meta property="og:site_name" content="Juggernaut Industries Limited" />
  <meta property="og:locale" content="en_NG" />
  <meta property="og:image" content="https://juggernautind.com/logo.png" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Juggernaut Industries Limited | Coming Soon" />
  <meta name="twitter:description" content="Our new website is under construction. Building Africa's Future Together since 2006." />
  <meta name="twitter:image" content="https://juggernautind.com/logo.png" />

  <!-- Fonts (same as main site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- DotLottie Player (latest stable) -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js"></script>

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Juggernaut Industries Limited",
    "url": "https://juggernautind.com",
    "logo": "https://juggernautind.com/logo.png",
    "description": "A Nigerian company delivering quality services across Mining, Agriculture, Construction, and Renewable Energy since 2006.",
    "foundingDate": "2006",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Abuja",
      "addressCountry": "NG"
    }
  }
  </script>

  <style>
    /* ===== BRAND TOKENS ===== */
    :root {
      --deep-navy: #0D1B2A;
      --steel-blue: #1B3A5C;
      --industrial-gold: #E8A317;
      --near-black: #111827;
      --dark-gray: #374151;
      --mid-gray: #6B7280;
      --light-gray: #D1D5DB;
      --off-white: #F3F4F6;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-heading: 'Montserrat', system-ui, sans-serif;
      --font-body: 'Nunito Sans', system-ui, sans-serif;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection {
      background-color: var(--industrial-gold);
      color: var(--near-black);
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--deep-navy); }
    ::-webkit-scrollbar-thumb { background: var(--steel-blue); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--industrial-gold); }

    /* ===== BASE ===== */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--deep-navy);
      color: var(--off-white);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== ANIMATED BACKGROUND ===== */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-layer::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120vmax;
      height: 120vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        ellipse at center,
        rgba(27, 58, 92, 0.5) 0%,
        rgba(13, 27, 42, 0) 70%
      );
      animation: pulse-glow 8s ease-in-out infinite alternate;
    }

    .bg-layer::after {
      content: '';
      position: absolute;
      top: 30%;
      left: 60%;
      width: 40vmax;
      height: 40vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        rgba(232, 163, 23, 0.04) 0%,
        transparent 60%
      );
      animation: drift 12s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      0%   { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes drift {
      0%   { transform: translate(-50%, -50%) translate(0, 0); }
      100% { transform: translate(-50%, -50%) translate(-5vw, 5vh); }
    }

    /* Subtle grid overlay */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }

    /* ===== MAIN CONTENT ===== */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 640px;
    }

    /* ===== LOGO ===== */
    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1rem;
      animation: fade-down 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(-16px);
    }

    .logo-wrapper img {
      width: 100px;
      height: auto;
      filter: brightness(1.1);
      margin-bottom: 0.25rem;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 600;
      color: var(--off-white);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 0.9;
    }

    .brand-subtitle {
      font-family: var(--font-heading);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mid-gray);
      margin-top: 0.15rem;
    }

    @keyframes fade-down {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== GOLD LINE ===== */
    .gold-line {
      width: 60px;
      height: 2px;
      background: var(--industrial-gold);
      margin: 0 auto 1rem;
      animation: line-grow 1s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform: scaleX(0);
    }

    @keyframes line-grow {
      to { transform: scaleX(1); }
    }

    @keyframes slide-up {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== LOTTIE PLAYER ===== */
    .lottie-wrapper {
      margin: 0 auto 3rem;
      width: min(600px, 85vw);
      height: auto;
      animation: slide-up 0.8s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    lottie-player {
      width: 100%;
      height: auto;
      display: block;
    }


    /* ===== CONTACT ===== */
    .contact {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mid-gray);
      animation: slide-up 0.8s 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    .contact a {
      color: var(--industrial-gold);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
    }

    .contact a:hover {
      border-bottom-color: var(--industrial-gold);
    }

    /* ===== FOOTER ===== */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      padding: 1.25rem;
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mid-gray);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      animation: fade-in 1s 1.4s forwards;
      opacity: 0;
    }

    .footer span {
      color: var(--industrial-gold);
    }

    @keyframes fade-in {
      to { opacity: 1; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .logo-wrapper img { width: 80px; }
      .lottie-wrapper { width: 360px; }
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Background effects -->
  <div class="bg-layer"></div>
  <div class="grid-overlay"></div>

  <!-- Main content -->
  <main class="content">
    <!-- Logo (navbar style) -->
    <div class="logo-wrapper">
      <img src="logo.png" alt="Juggernaut Industries Limited" width="80" height="80" />
      <span class="brand-name">JUGGERNAUT</span>
      <span class="brand-subtitle">Industries Ltd</span>
    </div>

    <div class="gold-line"></div>

    <!-- Lottie Animation -->
    <div class="lottie-wrapper">
      <lottie-player
        src="underconstruction white.json"
        background="transparent"
        speed="1"
        style="width: 100%; height: auto;"
        autoplay
      ></lottie-player>
    </div>


    <div class="contact">
      Get in touch — <a href="mailto:info@juggernautind.com">info@juggernautind.com</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 <span>Juggernaut Industries Limited</span>. All rights reserved.
  </footer>

</body>
</html>
