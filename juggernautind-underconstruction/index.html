<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juggernaut Industries — Coming Soon</title>
  <meta name="description" content="Juggernaut Industries Limited — Our new website is under construction. We are building something extraordinary." />

  <!-- Fonts (same as main site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- DotLottie Player -->
  <script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>

  <style>
    /* ===== BRAND TOKENS ===== */
    :root {
      --deep-navy: #0D1B2A;
      --steel-blue: #1B3A5C;
      --industrial-gold: #E8A317;
      --near-black: #111827;
      --dark-gray: #374151;
      --mid-gray: #6B7280;
      --light-gray: #D1D5DB;
      --off-white: #F3F4F6;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-heading: 'Montserrat', system-ui, sans-serif;
      --font-body: 'Nunito Sans', system-ui, sans-serif;
    }

    /* ===== RESET ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    ::selection {
      background-color: var(--industrial-gold);
      color: var(--near-black);
    }

    /* ===== BASE ===== */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-body);
      background: var(--deep-navy);
      color: var(--off-white);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== ANIMATED BACKGROUND ===== */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    /* Subtle radial glow */
    .bg-layer::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120vmax;
      height: 120vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        ellipse at center,
        rgba(27, 58, 92, 0.5) 0%,
        rgba(13, 27, 42, 0) 70%
      );
      animation: pulse-glow 8s ease-in-out infinite alternate;
    }

    /* Gold accent glow */
    .bg-layer::after {
      content: '';
      position: absolute;
      top: 30%;
      left: 60%;
      width: 40vmax;
      height: 40vmax;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        rgba(232, 163, 23, 0.04) 0%,
        transparent 60%
      );
      animation: drift 12s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      0%   { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 1;   transform: translate(-50%, -50%) scale(1.1); }
    }

    @keyframes drift {
      0%   { transform: translate(-50%, -50%) translate(0, 0); }
      100% { transform: translate(-50%, -50%) translate(-5vw, 5vh); }
    }

    /* ===== GRID OVERLAY ===== */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
    }

    /* ===== MAIN CONTENT ===== */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
      max-width: 640px;
      animation: fade-in 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes fade-in {
      to { opacity: 1; }
    }

    /* ===== GOLD LINE ===== */
    .gold-line {
      width: 60px;
      height: 2px;
      background: var(--industrial-gold);
      margin: 0 auto 2rem;
      animation: line-grow 1s 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform: scaleX(0);
    }

    @keyframes line-grow {
      to { transform: scaleX(1); }
    }

    /* ===== EYEBROW ===== */
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-heading);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--industrial-gold);
      margin-bottom: 1rem;
      animation: slide-up 0.8s 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    .eyebrow .line {
      width: 2rem;
      height: 1px;
      background: var(--industrial-gold);
    }

    @keyframes slide-up {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== HEADING ===== */
    .heading {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 300;
      line-height: 1.15;
      color: var(--off-white);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      animation: slide-up 0.8s 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    /* ===== LOTTIE PLAYER ===== */
    .lottie-wrapper {
      margin: 0 auto 2rem;
      width: min(320px, 80vw);
      animation: slide-up 0.8s 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    dotlottie-player {
      width: 100%;
      height: auto;
    }

    /* ===== BODY TEXT ===== */
    .description {
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.7;
      color: var(--light-gray);
      margin-bottom: 2.5rem;
      animation: slide-up 0.8s 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    /* ===== CONTACT LINK ===== */
    .contact {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: slide-up 0.8s 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
    }

    .contact a {
      color: var(--industrial-gold);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease;
    }

    .contact a:hover {
      border-bottom-color: var(--industrial-gold);
    }

    /* ===== FOOTER ===== */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      padding: 1.5rem;
      font-family: var(--font-heading);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--mid-gray);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      animation: fade-in 1s 1.5s forwards;
      opacity: 0;
    }

    .footer span {
      color: var(--industrial-gold);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .lottie-wrapper {
        width: 260px;
      }
    }
  </style>
</head>
<body>

  <!-- Background effects -->
  <div class="bg-layer"></div>
  <div class="grid-overlay"></div>

  <!-- Main content -->
  <main class="content">
    <div class="eyebrow">
      <span class="line"></span>
      Juggernaut Industries
      <span class="line"></span>
    </div>

    <h1 class="heading">Under Construction</h1>

    <div class="lottie-wrapper">
      <dotlottie-player
        src="underconstruction.lottie"
        background="transparent"
        speed="1"
        loop
        autoplay
      ></dotlottie-player>
    </div>

    <p class="description">
      We are building something extraordinary. Our new website is on its way — engineered with precision and built to impress.
    </p>

    <div class="contact">
      Get in touch — <a href="mailto:info@juggernautind.com">info@juggernautind.com</a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    &copy; 2025 <span>Juggernaut Industries Limited</span>. All rights reserved.
  </footer>

</body>
</html>
